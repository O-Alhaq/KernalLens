schema_version: 1
rules:
  - id: port_scan_basic
    name: Basic TCP Port Scan
    enabled: true
    category: network
    type: port_scan
    threshold: 10
    window_seconds: 5
    max_groups: 128
    severity: medium
    description: TCP SYN attempts from one source to ten distinct ports on one destination.

  - id: syn_flood_basic
    name: TCP SYN Flood
    enabled: true
    category: network
    type: syn_flood
    threshold: 1000
    window_seconds: 5
    max_groups: 128
    severity: high
    description: One source sent at least 1000 TCP SYN attempts to one destination in five seconds.

  - id: traffic_flood_example
    name: IPv4 Traffic Flood
    enabled: false
    category: network
    type: traffic_flood
    threshold: 2000
    window_seconds: 5
    max_groups: 128
    severity: medium
    description: Example volume rule; enable and tune for the observed network.

  - id: process_example
    name: Configured Process Watch
    enabled: false
    category: process
    type: process_match
    match:
      process_name: [example-tool]
    severity: low
    description: Example process selector; configure a locally relevant name before enabling.

  - id: denied_credential_syscall
    name: Denied Credential Syscall
    enabled: true
    category: syscall
    type: syscall_match
    match:
      syscall: [setuid, setgid]
      syscall_return: [-1]
    severity: low
    description: A monitored credential syscall returned EPERM; investigate according to local policy.

  - id: uid_change_to_root
    name: Effective UID Changed to Root
    enabled: true
    category: privilege
    type: privilege_change
    match:
      uid: [0]
      uid_changed: true
    severity: high
    description: A successful monitored syscall changed a non-root effective UID to root.
